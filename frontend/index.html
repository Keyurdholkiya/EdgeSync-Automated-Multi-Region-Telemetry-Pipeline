<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EdgeSync Enterprise Console</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-6 md:p-12">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-200 pb-5 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">EdgeSync Console</h1>
                <p class="text-sm text-slate-500 mt-1">Multi-Region Ingestion Infrastructure</p>
            </div>
            <div class="flex items-center gap-2 bg-emerald-50 text-emerald-700 px-4 py-1.5 rounded-lg text-xs font-semibold border border-emerald-200 shadow-sm">
                <span class="w-2 height-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
                Cluster: Operational
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="bg-white border border-slate-200 p-6 rounded-xl shadow-xs space-y-5">
                <div class="border-b border-slate-100 pb-2">
                    <h3 class="text-lg font-semibold text-slate-900">Telemetry Injector</h3>
                    <p class="text-xs text-slate-400">Simulate cluster traffic manually</p>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1.5">Target Service Node</label>
                        <input type="text" id="service" value="auth-service-pod-1" 
                               class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm font-mono text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1.5">Latency Threshold (ms)</label>
                        <input type="number" id="latency" value="42" 
                               class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm font-mono text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                    </div>
                    <button onclick="dispatch()" 
                            class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-lg font-medium text-sm shadow-sm transition active:scale-[0.98]">
                        Dispatch to Gateway
                    </button>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white border border-slate-200 p-6 rounded-xl shadow-xs flex flex-col">
                <div class="border-b border-slate-100 pb-2 mb-4 flex justify-between items-center">
                    <div>
                        <h3 class="text-lg font-semibold text-slate-900">Live Pipeline Logs</h3>
                        <p class="text-xs text-slate-400">Real-time upstream event log stream</p>
                    </div>
                    <span class="text-[10px] font-mono bg-slate-100 text-slate-600 px-2 py-0.5 rounded">Polling: 4s</span>
                </div>
                
                <div id="terminal" class="bg-slate-950 rounded-lg p-5 font-mono text-xs flex-grow overflow-y-auto max-h-[280px] shadow-inner space-y-2 text-slate-300">
                    </div>
            </div>

        </div>
    </div>

    <script>
        async function fetchLogs() {
            const term = document.getElementById('terminal');
            try {
                const res = await fetch('/api/telemetry/stream');
                const logs = await res.json();
                term.innerHTML = logs.map(l => `
                    <div class="border-b border-slate-900/50 pb-1 last:border-0">
                        <span class="text-slate-500">[${new Date(l.timestamp).toLocaleTimeString()}]</span> 
                        <span class="text-blue-400 font-medium">${l.service}</span> 
                        <span class="text-slate-400">status:</span> <span class="text-emerald-400 font-semibold">OK</span> 
                        <span class="text-slate-400">latency:</span> <span class="text-amber-400">${l.latency}ms</span>
                    </div>
                `).join('') || '<div class="text-slate-500">Pipeline empty. Awaiting mesh telemetry...</div>';
            } catch { 
                term.innerHTML = '<div class="text-rose-400 font-medium font-sans">⚠️ API Gateway connectivity timeout. Verify proxy state.</div>'; 
            }
        }
        
        async function dispatch() {
            const service = document.getElementById('service').value;
            const latency = document.getElementById('latency').value;
            if(!service || !latency) return;
            
            try {
                await fetch('/api/telemetry', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ service, status: "OK", latency: parseInt(latency) })
                });
                document.getElementById('latency').value = Math.floor(Math.random() * 100) + 10; // Random next value
                fetchLogs();
            } catch(e) {
                console.error("Transmission failed", e);
            }
        }
        
        fetchLogs();
        setInterval(fetchLogs, 4000);
    </script>
</body>
</html>
