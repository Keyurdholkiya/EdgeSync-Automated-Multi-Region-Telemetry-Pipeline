<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EdgeSync Enterprise Infrastructure Monitor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#0b0f1a] text-[#c9d1d9] font-sans min-h-screen p-6 md:p-10">
    <div class="max-w-[1400px] mx-auto space-y-10">
        
        <!-- Enterprise Header with Context -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-[#21262d] pb-6 gap-5">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    <span class="w-2.5 h-6 bg-[#21262d] rounded-sm"></span>
                    EdgeSync Infrastructure Mesh
                </h1>
                <p class="text-sm text-[#8b949e] mt-1.5 font-medium">Real-Time Centralized Telemetry Aggregator</p>
            </div>
            <div class="flex items-center gap-2.5 bg-[#161b22] text-[#3fb950] px-4 py-1.5 rounded-md text-xs font-semibold border border-[#30363d] shadow-inner">
                <span class="w-2 h-2 rounded-full bg-[#3fb950] inline-block animate-pulse"></span>
                Mesh Health: Connected
            </div>
        </header>

        <!-- Main Deployment Grid (Re-organized) -->
        <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">
            
            <!-- Service Configuration Panel (Full Width on Mobile, Left on Desk) -->
            <div class="xl:col-span-1 bg-[#161b22] border border-[#30363d] p-6 rounded-lg shadow-xl space-y-6">
                <div class="border-b border-[#21262d] pb-3">
                    <h3 class="text-lg font-semibold text-white">Event Simulation</h3>
                    <p class="text-xs text-[#8b949e]">Inject custom infrastructure events into the mesh gateway.</p>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-[#8b949e] mb-1.5">Upstream Node Identifier</label>
                        <input type="text" id="service" value="auth-service-pod-1" 
                               class="w-full bg-[#0b0f1a] border border-[#30363d] rounded p-2.5 text-sm font-mono text-[#c9d1d9] focus:outline-none focus:ring-1 focus:ring-[#58a6ff] transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-[#8b949e] mb-1.5">Simulated Latency (ms)</label>
                        <input type="number" id="latency" value="42" 
                               class="w-full bg-[#0b0f1a] border border-[#30363d] rounded p-2.5 text-sm font-mono text-[#c9d1d9] focus:outline-none focus:ring-1 focus:ring-[#58a6ff] transition">
                    </div>
                    <button onclick="dispatch()" 
                            class="w-full bg-[#1f6feb] hover:bg-[#1a5fcd] text-white py-2.5 rounded font-medium text-sm shadow transition active:scale-[0.99] active:shadow-inner">
                        Dispatch Event
                    </button>
                </div>
            </div>

            <!-- Centralized Log Stream (Main Focus) -->
            <div class="xl:col-span-3 bg-[#161b22] border border-[#30363d] p-6 rounded-lg shadow-xl flex flex-col">
                <div class="border-b border-[#21262d] pb-3 mb-5 flex justify-between items-center">
                    <div>
                        <h3 class="text-lg font-semibold text-white">Active Telemetry Stream</h3>
                        <p class="text-xs text-[#8b949e]">Real-time view of aggregated events passing the gateway.</p>
                    </div>
                    <span class="text-xs font-mono bg-[#0b0f1a] text-[#8b949e] px-2.5 py-1 rounded border border-[#30363d]">Gateway Port: 80 (Internal Mesh)</span>
                </div>
                
                <!-- Advanced Log View Container -->
                <div id="terminal" class="bg-[#0b0f1a] rounded-md p-6 font-mono text-xs flex-grow overflow-y-auto max-h-[400px] border border-[#30363d] space-y-2 text-[#8b949e]">
                    <!-- Logs will stream here -->
                </div>
            </div>

        </div>
    </div>

    <!-- Script Logic (No Changes Needed Here) -->
    <script>
        async function fetchLogs() {
            const term = document.getElementById('terminal');
            try {
                const res = await fetch('/api/telemetry/stream');
                const logs = await res.json();
                term.innerHTML = logs.map(l => `
                    <div class="border-b border-[#21262d]/50 pb-1.5 last:border-0 hover:bg-[#161b22]/50 px-2 rounded-sm transition">
                        <span class="text-[#8b949e]">[${new Date(l.timestamp).toLocaleTimeString()}]</span> 
                        <span class="text-[#58a6ff] font-medium">INFO</span>
                        <span class="text-[#c9d1d9]">Upstream</span> 
                        <span class="text-[#f85149] font-medium">${l.service}</span> 
                        <span class="text-[#c9d1d9]">successfully tracked response latency</span> <span class="text-[#e3b341]">${l.latency}ms</span>.
                    </div>
                `).join('') || '<div class="text-[#8b949e]">Pipeline quiet. Aggregating mesh events...</div>';
            } catch { 
                term.innerHTML = '<div class="text-[#f85149] font-medium font-sans border-l-4 border-[#f85149] bg-[#f85149]/10 p-3 rounded">⚠️ Edge Gateway mesh connectivity timeout. Check infrastructure health.</div>'; 
            }
        }
        
        async function dispatch() {
            const service = document.getElementById('service').value;
            const latency = document.getElementById('latency').value;
            if(!service || !latency) return;
            
            try {
                await fetch('/api/telemetry', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ service, status: "OK", latency: parseInt(latency) })
                });
                document.getElementById('latency').value = Math.floor(Math.random() * 80) + 5; 
                fetchLogs();
            } catch(e) {
                console.error("Transmission fault detected", e);
            }
        }
        
        fetchLogs();
        setInterval(fetchLogs, 4000);
    </script>
</body>
</html>
